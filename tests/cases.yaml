- id: K02
  trap: none
  expected: 合致
  requirement: 稼働中の得意先ごとの店舗数を知りたい（店舗が無い得意先も 0 として含める）。
  sql: |
    SELECT c.customer_id, c.customer_name, COUNT(DISTINCT st.store_id) AS store_count
    FROM `dojo.customers` c
    LEFT JOIN `dojo.stores` st ON c.customer_id = st.customer_id
    WHERE c.is_active
    GROUP BY c.customer_id, c.customer_name
  reference: |
    SELECT c.customer_id, c.customer_name,
           (SELECT COUNT(*) FROM `dojo.stores` st WHERE st.customer_id = c.customer_id) AS store_count
    FROM `dojo.customers` c
    WHERE c.is_active
