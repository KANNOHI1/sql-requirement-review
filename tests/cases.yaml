- id: C11
  trap: T11
  expected: 不一致
  requirement: 2026年6月の、目標がある得意先全体での目標達成率を知りたい。
  sql: |
    WITH act AS (
      SELECT st.customer_id, SUM(s.amount) AS actual
      FROM `dojo.sales` s
      JOIN `dojo.stores` st ON s.store_id = st.store_id
      WHERE DATE(s.sale_ts, 'Asia/Tokyo') BETWEEN DATE '2026-06-01' AND DATE '2026-06-30'
      GROUP BY st.customer_id
    )
    SELECT AVG(COALESCE(a.actual, 0) / t.target_amount) AS achievement_rate
    FROM `dojo.targets` t
    LEFT JOIN act a ON t.customer_id = a.customer_id
    WHERE t.fiscal_month = DATE '2026-06-01'
  reference: |
    WITH act AS (
      SELECT st.customer_id, SUM(s.amount) AS actual
      FROM `dojo.sales` s
      JOIN `dojo.stores` st ON s.store_id = st.store_id
      WHERE DATE(s.sale_ts, 'Asia/Tokyo') BETWEEN DATE '2026-06-01' AND DATE '2026-06-30'
      GROUP BY st.customer_id
    )
    SELECT SUM(COALESCE(a.actual, 0)) / SUM(t.target_amount) AS achievement_rate
    FROM `dojo.targets` t
    LEFT JOIN act a ON t.customer_id = a.customer_id
    WHERE t.fiscal_month = DATE '2026-06-01'

