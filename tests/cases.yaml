- id: C01
  trap: T01
  expected: 不一致
  requirement: 2026年6月（JST）のうち、化粧水（P001）に何らかの施策が実施されていた日の、化粧水の売上合計を知りたい。
  sql: |
    SELECT SUM(s.amount) AS sales_amount
    FROM `dojo.sales` s
    JOIN `dojo.promotions` p
      ON s.product_id = p.product_id
     AND DATE(s.sale_ts, 'Asia/Tokyo') BETWEEN p.start_date AND p.end_date
    WHERE s.product_id = 'P001'
      AND DATE(s.sale_ts, 'Asia/Tokyo') BETWEEN DATE '2026-06-01' AND DATE '2026-06-30'
  reference: |
    SELECT SUM(s.amount) AS sales_amount
    FROM `dojo.sales` s
    WHERE s.product_id = 'P001'
      AND DATE(s.sale_ts, 'Asia/Tokyo') BETWEEN DATE '2026-06-01' AND DATE '2026-06-30'
      AND EXISTS (
        SELECT 1 FROM `dojo.promotions` p
        WHERE p.product_id = s.product_id
          AND DATE(s.sale_ts, 'Asia/Tokyo') BETWEEN p.start_date AND p.end_date)

- id: C02
  trap: T02
  expected: 不一致
  requirement: 2026年6月の目標がある得意先すべてについて、6月（JST）の売上実績と目標を並べた一覧がほしい。
  sql: |
    WITH act AS (
      SELECT st.customer_id, SUM(s.amount) AS actual
      FROM `dojo.sales` s
      JOIN `dojo.stores` st ON s.store_id = st.store_id
      WHERE DATE(s.sale_ts, 'Asia/Tokyo') BETWEEN DATE '2026-06-01' AND DATE '2026-06-30'
      GROUP BY st.customer_id
    )
    SELECT t.customer_id, t.target_amount, a.actual
    FROM `dojo.targets` t
    JOIN act a ON t.customer_id = a.customer_id
    WHERE t.fiscal_month = DATE '2026-06-01'
  reference: |
    WITH act AS (
      SELECT st.customer_id, SUM(s.amount) AS actual
      FROM `dojo.sales` s
      JOIN `dojo.stores` st ON s.store_id = st.store_id
      WHERE DATE(s.sale_ts, 'Asia/Tokyo') BETWEEN DATE '2026-06-01' AND DATE '2026-06-30'
      GROUP BY st.customer_id
    )
    SELECT t.customer_id, t.target_amount, COALESCE(a.actual, 0) AS actual
    FROM `dojo.targets` t
    LEFT JOIN act a ON t.customer_id = a.customer_id
    WHERE t.fiscal_month = DATE '2026-06-01'

